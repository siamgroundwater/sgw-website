name: Production monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check public site, MongoDB health, learning routes, redirects, and sitemap
        env:
          MONITOR_BASE_URL: ${{ vars.MONITOR_BASE_URL }}
        run: node scripts/monitor-production.mjs
