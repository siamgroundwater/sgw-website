name: Cleanup staged project media

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove expired unreferenced project uploads
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONITOR_BASE_URL: ${{ vars.MONITOR_BASE_URL }}
        run: node scripts/trigger-media-cleanup.mjs
