name: Quality checks

on:
  push:
    branches: ['master', 'main']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SGW_CI_SKIP_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install isolated browser test runtime
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check learning interactions on desktop and touch screens
        run: npm run test:e2e:learning
      - name: Start an isolated MongoDB replica set for transactional CMS tests
        run: |
          docker run --detach --name cms-test-mongo --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec cms-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec cms-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec cms-test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check CMS live saving, access, recovery, and responsive interactions
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          MONGODB_DB: sgw_ci_source_never_used
        run: npm run test:e2e:cms
      - name: Stop isolated database
        if: always()
        run: docker rm --force cms-test-mongo || true
